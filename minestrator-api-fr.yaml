openapi: 3.1.0
info:
  title: MineStrator API
  version: 1.0.0
  summary: API REST officielle de MineStrator.com
  termsOfService: https://minestrator.com/conditions/general/vente
  x-overview: |
    Contexte MineStrator (pour assistants IA, non affiché dans la doc HTML) :

    MineStrator est un hébergeur de serveurs — principalement des serveurs de jeu
    (Minecraft, etc.), mais aussi d'autres services : bases de données, outils (Grafana,
    Prometheus…) ou runtimes (Node.js, Python, Ruby…). Un client souscrit à une MyBox
    (une offre avec un quota de ressources : CPU, RAM, disque, bases de données) et y crée
    un ou plusieurs serveurs qui se partagent ces ressources.

    - Utilisateur : le compte client ; il possède des MyBox et des serveurs (ou y accède
      en sous-utilisateur avec des permissions déléguées).
    - MyBox : l'offre d'un client, un pool de ressources (CPU / RAM / disque / bases de
      données). Une MyBox contient un ou plusieurs serveurs.
    - Serveur : une instance hébergée dans une MyBox — un serveur de jeu le plus souvent,
      mais aussi une base de données, un outil ou un runtime — avec sa part de ressources
      allouée.

    Cette API permet de piloter ses serveurs (état, alimentation, commandes, réglages)
    et de consulter son compte et ses MyBox.
  description: |
    ## Authentification

    Chaque requête doit inclure votre clé API dans le header `Authorization` :

    ```
    Authorization: Bearer VOTRE_CLÉ
    ```

    Récupérez votre clé dans votre panel : [Compte → Clés API](https://minestrator.com/my/account?section=api).
    Elle y est affichée **déjà encodée** : collez-la telle quelle, ne la ré-encodez pas.

    ## Conditions d'utilisation

    L'API est accessible à tous les clients MineStrator.com.
    L'utilisation depuis une application externe doit être contrôlée, raisonnable
    et dans le cadre d'un usage standard des services MineStrator.com.
    En cas d'abus, l'accès API peut être désactivé et le compte associé suspendu.

    L'usage de l'API est soumis aux [conditions générales d'utilisation de MineStrator](https://minestrator.com/conditions/general/vente).
  contact:
    name: MineStrator
    url: https://minestrator.com
servers:
  - url: https://mine.sttr.io
    description: Production
security:
  - BearerAuth: []
tags:
  - name: User
    description: Compte et données utilisateur
  - name: Server
    description: Gestion et pilotage des serveurs
  - name: MyBox
    description: Offres MyBox et serveurs associés
  - name: Snapshots
    description: Snapshots de serveurs (sauvegardes complètes)
paths:
  /user:
    get:
      tags:
        - User
      summary: Récupérer son profil
      description: |
        Récupère les informations de **votre propre compte** : profil, solde de crédits
        et comptes de jeu liés.

        **Accès** : authentification requise. L'endpoint renvoie toujours le compte
        associé à votre clé API.
      operationId: getUser
      responses:
        '200':
          description: Données utilisateur récupérées avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: User - Informations - Get user datas
                      endpoint:
                        type: string
                        example: /user
                      code:
                        type: integer
                        example: 200
                      data:
                        $ref: '#/components/schemas/UserData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /user/{id_user}/servers:
    get:
      tags:
        - User
      summary: Lister ses MyBox et serveurs
      description: |
        Récupère **vos propres serveurs** : les MyBox auxquelles vous avez accès
        (`servers_groups`, indexées par ID) et la liste à plat de vos serveurs (`servers`),
        possédés ou accessibles en sous-utilisateur.

        **Accès** : authentification requise. Vous ne pouvez lister que vos propres serveurs
        (`id_user` doit correspondre à votre compte).
      operationId: getUserServers
      parameters:
        - name: id_user
          in: path
          required: true
          description: Votre ID utilisateur.
          schema:
            type: integer
            example: 12345
      responses:
        '200':
          description: Serveurs de l'utilisateur récupérés avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: User - Servers - Get user servers
                      endpoint:
                        type: string
                        example: /user/12345/servers
                      code:
                        type: integer
                        example: 200
                      data:
                        $ref: '#/components/schemas/UserServersData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /mybox/{id_mybox}:
    get:
      tags:
        - MyBox
      summary: Récupérer les informations d'une MyBox
      description: |
        Récupère les informations d'une MyBox : état, offre et ressources, et la liste de
        ses serveurs.

        **Accès** : propriétaire de la MyBox, ou sous-utilisateur avec la permission `view`.
      operationId: getMyBox
      parameters:
        - name: id_mybox
          in: path
          required: true
          description: ID de la MyBox.
          schema:
            type: integer
            example: 12345
      responses:
        '200':
          description: Données de la MyBox récupérées avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: MyBox - Actions - Get datas
                      endpoint:
                        type: string
                        example: /mybox/12345
                      code:
                        type: integer
                        example: 200
                      data:
                        $ref: '#/components/schemas/MyBoxData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /mybox/{id_mybox}/server:
    post:
      tags:
        - MyBox
      summary: Créer un serveur
      description: |
        Crée un nouveau serveur dans une MyBox et lance son installation. Le serveur
        partage les ressources (CPU / RAM / disque) de la MyBox.

        Indiquez le type de serveur via `id_egg` **ou** `id_egg_experimental` (l'un des
        deux est requis). Sur une MyBox encore vide, si `cpu` et `ram` sont omis, toutes
        les ressources de l'offre sont allouées au serveur — sauf si `force_settings`
        est défini.

        Les `id` valides se récupèrent via `GET /server/catalog/locations` (champ
        `location`) et `GET /server/catalog/eggs` (champ `id_egg`).

        **Accès** : propriétaire de la MyBox, ou sous-utilisateur avec la permission
        `server_create`.
      operationId: createMyBoxServer
      parameters:
        - name: id_mybox
          in: path
          required: true
          description: ID de la MyBox.
          schema:
            type: integer
            example: 12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - location
              properties:
                location:
                  type: integer
                  description: ID de la localisation (datacenter) où héberger le serveur.
                  example: 1
                id_egg:
                  type: integer
                  description: ID du type de serveur (egg). Requis si `id_egg_experimental` est absent.
                  example: 1
                id_egg_experimental:
                  type: integer
                  description: ID d'un egg expérimental. Requis si `id_egg` est absent.
                  example: 0
                cpu:
                  type: integer
                  description: Cœurs CPU à allouer. Optionnel pour le premier serveur d'une MyBox vide.
                  example: 2
                ram:
                  type: integer
                  description: RAM à allouer, en Go. Optionnel pour le premier serveur d'une MyBox vide.
                  example: 4
                name:
                  type: string
                  maxLength: 100
                  description: Nom du serveur.
                  example: Mon serveur Survie
                required_fields:
                  type: array
                  description: Valeurs des champs requis par l'egg choisi.
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                        example: SERVER_VERSION
                      value:
                        type: string
                        example: '1.21'
                force_settings:
                  type: integer
                  description: Empêche l'allocation automatique de toute l'offre au premier serveur.
                  example: 0
      responses:
        '200':
          description: Serveur créé avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: MyBox - Server - Create a server
                      endpoint:
                        type: string
                        example: /mybox/12345/server
                      code:
                        type: integer
                        example: 200
                      data:
                        type: object
                        properties:
                          id_mybox:
                            type: integer
                            description: ID de la MyBox.
                            example: 12345
                          id_server:
                            type: integer
                            description: ID du serveur créé.
                            example: 67890
                          ip:
                            type: string
                            description: Adresse de connexion du serveur (IP:port).
                            example: 51.83.42.10:25565
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - MyBox
      summary: Modifier les ressources d'un serveur
      description: |
        Modifie le CPU et la RAM alloués à un serveur, dans la limite des ressources de
        l'offre de la MyBox.

        Le serveur doit être **éteint** pour être redimensionné.

        **Accès** : propriétaire de la MyBox, ou sous-utilisateur avec la permission
        `server_update`.
      operationId: updateMyBoxServerResources
      parameters:
        - name: id_mybox
          in: path
          required: true
          description: ID de la MyBox.
          schema:
            type: integer
            example: 12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_server
                - cpu
                - ram
              properties:
                id_server:
                  type: integer
                  description: ID du serveur à modifier.
                  example: 67890
                cpu:
                  type: integer
                  description: Cœurs CPU à allouer.
                  example: 2
                ram:
                  type: integer
                  description: RAM à allouer, en Go.
                  example: 4
      responses:
        '200':
          description: Ressources du serveur modifiées avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: MyBox - Server - Edit server resources
                      endpoint:
                        type: string
                        example: /mybox/12345/server
                      code:
                        type: integer
                        example: 200
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /mybox/{id_mybox}/server/{id_server}:
    delete:
      tags:
        - MyBox
      summary: Supprimer un serveur
      description: |
        Supprime définitivement un serveur de la MyBox. Cette action est
        **irréversible** : le serveur et ses données sont détruits, et ses ressources
        sont libérées dans la MyBox.

        **Accès** : propriétaire de la MyBox, ou sous-utilisateur avec la permission
        `server_delete`.
      operationId: deleteMyBoxServer
      parameters:
        - name: id_mybox
          in: path
          required: true
          description: ID de la MyBox.
          schema:
            type: integer
            example: 12345
        - name: id_server
          in: path
          required: true
          description: ID du serveur à supprimer.
          schema:
            type: integer
            example: 67890
      responses:
        '200':
          description: Serveur supprimé avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: MyBox - Server - Delete a server
                      endpoint:
                        type: string
                        example: /mybox/12345/server/67890
                      code:
                        type: integer
                        example: 200
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /mybox/{id_mybox}/server/enable:
    patch:
      tags:
        - MyBox
      summary: Activer un serveur
      description: |
        Réactive un serveur précédemment désactivé. Le serveur reprend sa part de
        ressources dans la MyBox — l'offre doit donc avoir assez de CPU / RAM
        disponibles.

        **Accès** : propriétaire de la MyBox, ou sous-utilisateur avec la permission
        `server_status`.
      operationId: enableMyBoxServer
      parameters:
        - name: id_mybox
          in: path
          required: true
          description: ID de la MyBox.
          schema:
            type: integer
            example: 12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_server
              properties:
                id_server:
                  type: integer
                  description: ID du serveur à activer.
                  example: 67890
      responses:
        '200':
          description: Serveur activé avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: MyBox - Server - Enable a server
                      endpoint:
                        type: string
                        example: /mybox/12345/server/enable
                      code:
                        type: integer
                        example: 200
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /mybox/{id_mybox}/server/disable:
    patch:
      tags:
        - MyBox
      summary: Désactiver un serveur
      description: |
        Désactive un serveur sans le supprimer : il est suspendu et libère sa part de
        ressources dans la MyBox, qui redeviennent disponibles pour les autres serveurs.
        Réactivable à tout moment.

        **Accès** : propriétaire de la MyBox, ou sous-utilisateur avec la permission
        `server_status`.
      operationId: disableMyBoxServer
      parameters:
        - name: id_mybox
          in: path
          required: true
          description: ID de la MyBox.
          schema:
            type: integer
            example: 12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_server
              properties:
                id_server:
                  type: integer
                  description: ID du serveur à désactiver.
                  example: 67890
      responses:
        '200':
          description: Serveur désactivé avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: MyBox - Server - Disable a server
                      endpoint:
                        type: string
                        example: /mybox/12345/server/disable
                      code:
                        type: integer
                        example: 200
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /server/catalog/locations:
    get:
      tags:
        - Server
      summary: Lister les localisations disponibles
      description: |
        Liste les localisations où un serveur peut être créé. Utilisez
        l'`id` retourné comme champ `location` lors de la création d'un serveur.

        **Accès** : tout client authentifié.
      operationId: getServerCatalogLocations
      responses:
        '200':
          description: Localisations récupérées avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: Server - Catalog - Available locations
                      endpoint:
                        type: string
                        example: /server/catalog/locations
                      code:
                        type: integer
                        example: 200
                      data:
                        type: object
                        properties:
                          locations:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: Identifiant de la localisation (à passer en `location`).
                                  example: 1
                                city:
                                  type: string
                                  description: Ville du datacenter.
                                  example: Toulouse
                                country:
                                  type: string
                                  description: Pays.
                                  example: France
                                country_iso:
                                  type: string
                                  description: Code pays ISO 3166-1 alpha-2.
                                  example: FR
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /server/catalog/eggs:
    get:
      tags:
        - Server
      summary: Lister les types de serveur (eggs) disponibles
      description: |
        Liste les types de serveur disponibles à la création (jeux, bases de données,
        outils, runtimes…). Utilisez l'`id` retourné comme champ `id_egg` lors de la
        création.

        `required_fields` indique les champs que l'egg impose : reportez chaque `key`
        dans le tableau `required_fields` du corps de création.

        **Accès** : tout client authentifié.
      operationId: getServerCatalogEggs
      responses:
        '200':
          description: Types de serveur récupérés avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: Server - Catalog - Available eggs
                      endpoint:
                        type: string
                        example: /server/catalog/eggs
                      code:
                        type: integer
                        example: 200
                      data:
                        type: object
                        properties:
                          eggs:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: Identifiant du type de serveur (à passer en `id_egg`).
                                  example: 1
                                name:
                                  type: string
                                  description: Nom du type de serveur.
                                  example: Minecraft
                                required_fields:
                                  type: array
                                  description: Champs imposés par l'egg, à fournir dans `required_fields` à la création.
                                  items:
                                    type: object
                                    properties:
                                      key:
                                        type: string
                                        example: STEAM_USER
                                      label:
                                        type: string
                                        example: '[Host] Steam Username'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /server/{id_server}:
    get:
      tags:
        - Server
      summary: Récupérer les informations d'un serveur
      description: |
        Récupère les informations complètes d'un serveur.

        **Accès** : propriétaire du serveur, ou sous-utilisateur avec la permission `view`.
        Certains blocs de la réponse nécessitent une permission supplémentaire :
        `ports` (`ports_view`), `sftp` (`sftp`), `livemap` (`livemap`) — sans elle, le bloc
        est absent.
      operationId: getServerDatas
      parameters:
        - name: id_server
          in: path
          required: true
          description: ID du serveur
          schema:
            type: integer
            example: 67890
      responses:
        '200':
          description: Données du serveur récupérées avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: Server - Actions - Get datas
                      endpoint:
                        type: string
                        example: /server/67890
                      code:
                        type: integer
                        example: 200
                      data:
                        $ref: '#/components/schemas/ServerFullData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /server/{id_server}/live:
    get:
      tags:
        - Server
      summary: Récupérer les statistiques temps réel d'un serveur
      description: |
        Renvoie l'état et les statistiques temps réel d'un serveur. Pour un serveur en
        ligne, les joueurs connectés et les informations du jeu sont aussi renvoyés **si le
        jeu est supporté** (certains jeux ne permettent pas de récupérer ces données).

        **Accès** : propriétaire du serveur, ou sous-utilisateur avec la permission `view`.
      operationId: getServerLiveData
      parameters:
        - name: id_server
          in: path
          required: true
          description: ID du serveur
          schema:
            type: integer
            example: 67890
      responses:
        '200':
          description: Statistiques temps réel récupérées avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: Server - Actions - Get live datas
                      endpoint:
                        type: string
                        example: /server/67890/live
                      code:
                        type: integer
                        example: 200
                      data:
                        $ref: '#/components/schemas/ServerLiveData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /server/{id_server}/live/light:
    get:
      tags:
        - Server
      summary: Récupérer les données live complémentaires (version allégée)
      description: |
        Version allégée de `GET /server/{id_server}/live`, pensée pour accompagner la
        connexion websocket. Les informations de jeu (joueurs connectés, version…) ne
        sont disponibles que **si le jeu est supporté** (certains jeux ne permettent pas
        de récupérer ces données).

        **Accès** : propriétaire du serveur, ou sous-utilisateur avec la permission `view`.
      operationId: getServerLiveLight
      parameters:
        - name: id_server
          in: path
          required: true
          description: ID du serveur
          schema:
            type: integer
            example: 67890
      responses:
        '200':
          description: Données live allégées récupérées avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: Server - Actions - Get live datas (light)
                      endpoint:
                        type: string
                        example: /server/67890/live/light
                      code:
                        type: integer
                        example: 200
                      data:
                        type: object
                        properties:
                          status:
                            type:
                              - string
                              - 'null'
                            description: Statut côté infrastructure (ex. `installing`) ; `null` si aucun état particulier
                            example: null
                          cpu:
                            type: object
                            description: Limites CPU (en centièmes de cœur — 100 = 1 cœur). L'usage instantané vient du websocket.
                            properties:
                              dedicated:
                                type: integer
                                description: CPU dédié au serveur
                                example: 200
                              flexcore:
                                type: integer
                                description: CPU partagé additionnel (FlexCore) fourni par l'offre
                                example: 100
                              limit:
                                type: integer
