  /server/{id_server}/poweraction:
    put:
      tags:
        - Server
      summary: Envoyer une action d'alimentation
      description: |
        Démarre, redémarre, arrête ou force l'arrêt d'un serveur. Les variantes
        `restart10` / `stop10` diffusent un compte à rebours de 10 secondes avant d'agir
        (la requête reste alors bloquée ~10 s).

        **Accès** : propriétaire du serveur, ou sous-utilisateur avec la permission
        correspondant à l'action (`poweraction_start`, `poweraction_restart`,
        `poweraction_stop`, `poweraction_kill`).
      operationId: sendServerPowerAction
      parameters:
        - name: id_server
          in: path
          required: true
          description: ID du serveur
          schema:
            type: integer
            example: 67890
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - poweraction
              properties:
                poweraction:
                  type: string
                  enum:
                    - start
                    - restart
                    - restart10
                    - stop
                    - stop10
                    - kill
                  description: |
                    Action à exécuter :
                    - `start` : démarrer le serveur
                    - `restart` : redémarrer immédiatement
                    - `restart10` : redémarrer avec un compte à rebours de 10 s dans la console
                    - `stop` : arrêter immédiatement
                    - `stop10` : arrêter avec un compte à rebours de 10 s dans la console
                    - `kill` : forcer l'arrêt du processus
                  example: start
      responses:
        '200':
          description: Action transmise avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: Server - Actions - Send power action
                      endpoint:
                        type: string
                        example: /server/67890/poweraction
                      code:
                        type: integer
                        example: 200
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
