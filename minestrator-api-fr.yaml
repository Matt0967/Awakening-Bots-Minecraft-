              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: User - Snapshots - Get user snapshots
                      endpoint:
                        type: string
                        example: /user/12345/snapshots
                      code:
                        type: integer
                        example: 200
                      data:
                        type: object
                        properties:
                          snapshots:
                            type: array
                            description: Snapshots du compte, disponibles et en cours de création
                            items:
                              type: object
                              properties:
                                id:
                                  type:
                                    - integer
                                    - string
                                  description: ID de la snapshot. Pour une création en cours, chaîne `job_{job_id}`.
                                  example: 321
                                name:
                                  type: string
                                  description: Nom de la snapshot.
                                  example: Avant mise à jour
                                type:
                                  type: string
                                  description: Jeu ou type du serveur d'origine.
                                  example: Minecraft Java
                                size:
                                  type: integer
                                  description: Taille de la snapshot (Ko).
                                  example: 7019768
                                date:
                                  type: string
                                  format: date-time
                                  description: Date de création.
                                status:
                                  type: integer
                                  enum:
                                    - 0
                                    - 1
                                    - 2
                                  description: État — `0` en attente, `1` disponible, `2` en cours de création.
                                  example: 1
                                progress:
                                  type: integer
                                  description: Avancement en % (créations en cours uniquement).
                                  example: 42
                                job_id:
                                  type: integer
                                  description: ID du job de traitement (créations en cours uniquement).
                                  example: 4567
                                is_legacy:
                                  type: boolean
                                  description: Snapshot issue de l'ancien système de sauvegarde.
                                  example: false
                                is_v2_job:
                                  type: boolean
                                  description: Présent (`true`) pour une création en cours.
                                  example: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /user/{id_user}/snapshot:
    post:
      tags:
        - Snapshots
      summary: Créer une snapshot
      description: |
        Crée une snapshot d'un de vos serveurs : une sauvegarde complète que vous pourrez
        restaurer plus tard, sur ce serveur ou sur un autre.

        Le traitement est **asynchrone** : la réponse renvoie un `job_id` qui identifie le
        job lancé en arrière-plan.

        **Accès** : le titulaire du compte (la clé doit correspondre à `id_user`).
      operationId: createSnapshot
      parameters:
        - name: id_user
          in: path
          required: true
          description: ID de l'utilisateur.
          schema:
            type: integer
            example: 12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_server
                - name
              properties:
                id_server:
                  type: integer
                  description: ID du serveur à sauvegarder.
                  example: 67890
                name:
                  type: string
                  maxLength: 64
                  description: Nom de la snapshot.
                  example: Avant mise à jour
      responses:
        '200':
          description: Snapshot mise en file de traitement
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: User - Snapshots - Create snapshot
                      endpoint:
                        type: string
                        example: /user/12345/snapshot
                      code:
                        type: integer
                        example: 200
                      data:
                        type: object
                        properties:
                          job_id:
                            type: integer
                            description: Identifiant du job de traitement (suivi de progression).
                            example: 4567
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Une offre payante active est requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                api:
                  description: ''
                  endpoint: ''
                  code: 402
                  error: API_ARCHIVE_NEED_PAID_OFFER
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Limite de snapshots atteinte, ou un traitement est déjà en cours sur ce serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                api:
                  description: ''
                  endpoint: ''
                  code: 409
                  error: API_SNAPSHOT_ALREADY_PROCESSING
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags:
        - Snapshots
      summary: Restaurer une snapshot
      description: |
        Restaure une snapshot sur un serveur cible : le contenu actuel du serveur est
        remplacé par celui de la snapshot.

        Le traitement est **asynchrone** : la réponse renvoie un `job_id` qui identifie le
        job lancé en arrière-plan.

        **Accès** : le titulaire du compte (la clé doit correspondre à `id_user`).
      operationId: restoreSnapshot
      parameters:
        - name: id_user
          in: path
          required: true
          description: ID de l'utilisateur.
          schema:
            type: integer
            example: 12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_snapshot
                - id_server
              properties:
                id_snapshot:
                  type: integer
                  description: ID de la snapshot à restaurer.
                  example: 321
                id_server:
                  type: integer
                  description: ID du serveur cible sur lequel restaurer.
                  example: 67890
      responses:
        '200':
          description: Restauration mise en file de traitement
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: User - Snapshots - Restore snapshot
                      endpoint:
                        type: string
                        example: /user/12345/snapshot
                      code:
                        type: integer
                        example: 200
                      data:
                        type: object
                        properties:
                          job_id:
                            type: integer
                            description: Identifiant du job de traitement (suivi de progression).
                            example: 4568
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Une offre payante active est requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                api:
                  description: ''
                  endpoint: ''
                  code: 402
                  error: API_ARCHIVE_NEED_PAID_OFFER
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Un traitement est déjà en cours sur le serveur cible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                api:
                  description: ''
                  endpoint: ''
                  code: 409
                  error: API_SNAPSHOT_ALREADY_PROCESSING
        '429':
          $ref: '#/components/responses/RateLimited'
  /user/{id_user}/snapshot/{id_snapshot}:
    delete:
      tags:
        - Snapshots
      summary: Supprimer une snapshot
      description: |
        Supprime définitivement une snapshot.

        Le traitement est **asynchrone** : la réponse renvoie un `job_id` qui identifie le
        job lancé en arrière-plan.

        **Accès** : le titulaire du compte (la clé doit correspondre à `id_user`).
      operationId: deleteSnapshot
      parameters:
        - name: id_user
          in: path
          required: true
          description: ID de l'utilisateur.
          schema:
            type: integer
            example: 12345
        - name: id_snapshot
          in: path
          required: true
          description: ID de la snapshot.
          schema:
            type: integer
            example: 321
      responses:
        '200':
          description: Suppression mise en file de traitement
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: User - Snapshots - Delete snapshot
                      endpoint:
                        type: string
                        example: /user/12345/snapshot/321
                      code:
                        type: integer
                        example: 200
                      data:
                        type: object
                        properties:
                          job_id:
                            type: integer
                            description: Identifiant du job de traitement (suivi de progression).
                            example: 4569
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /server/{id_server}/backups:
    get:
      tags:
        - Server
      summary: Lister les sauvegardes d'un serveur
      description: |
        Renvoie la liste des sauvegardes quotidiennes d'un serveur, triées de la plus récente
        à la plus ancienne.

        **Accès** : propriétaire du serveur, ou sous-utilisateur avec la permission `saves_view`.

        **Maintenance** : si le système de sauvegarde est en maintenance, l'API répond **503**
        (`API_SMART_BACKUP_MAINTENANCE`).
      operationId: getServerBackups
      parameters:
        - name: id_server
          in: path
          required: true
          description: ID du serveur
          schema:
            type: integer
            example: 67890
      responses:
        '200':
          description: Liste des sauvegardes récupérée avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: Server - Backups - Get backups
                      endpoint:
                        type: string
                        example: /server/67890/backups
                      code:
                        type: integer
                        example: 200
                      data:
                        type: object
                        properties:
                          backups:
                            type: array
                            description: Sauvegardes, de la plus récente à la plus ancienne
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: Identifiant de la sauvegarde
                                  example: 4815162342
                                size:
                                  type: integer
                                  description: Taille de la sauvegarde (octets)
                                  example: 524288000
                                date:
                                  type: string
                                  format: date-time
                                  description: Date de création de la sauvegarde
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Système de sauvegarde en maintenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                api:
                  description: ''
                  endpoint: ''
                  code: 503
                  error: API_SMART_BACKUP_MAINTENANCE
  /server/{id_server}/backup:
    put:
      tags:
        - Server
      summary: Restaurer une sauvegarde
      description: |
        Lance la **restauration** d'une sauvegarde sur un serveur. L'opération est
        **asynchrone** : la réponse **200** signale uniquement la prise en compte de la demande
        (le serveur est suspendu le temps de la restauration). Une seule restauration à la fois
        par serveur.

        **Accès** : propriétaire du serveur, ou sous-utilisateur avec la permission
        `saves_restore`. Le propriétaire est notifié si l'action vient d'un sous-utilisateur.

        **Maintenance** : si le système de sauvegarde est en maintenance, l'API répond **503**
        (`API_SMART_BACKUP_MAINTENANCE`).
      operationId: restoreServerBackup
      parameters:
        - name: id_server
          in: path
          required: true
          description: ID du serveur
          schema:
            type: integer
            example: 67890
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_backup
              properties:
                id_backup:
                  type: integer
                  description: ID de la sauvegarde à restaurer (parmi celles du serveur)
                  example: 123
      responses:
        '200':
          description: Demande de restauration prise en compte (traitement asynchrone)
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: object
                    properties:
                      description:
                        type: string
                        example: Server - Backups - Restore backup
                      endpoint:
                        type: string
                        example: /server/67890/backup
                      code:
                        type: integer
                        example: 200
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Une restauration est déjà en cours sur ce serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                api:
                  description: ''
                  endpoint: ''
                  code: 409
                  error: API_BACKUP_ALREADY_IN_PROGRESS
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Système de sauvegarde en maintenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                api:
                  description: ''
                  endpoint: ''
                  code: 503
                  error: API_SMART_BACKUP_MAINTENANCE
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Clé API telle qu'affichée dans le panel (déjà encodée, à ne pas ré-encoder).
  schemas:
    UserData:
      type: object
      properties:
        user:
          type: object
          properties:
            datas:
              type: object
              description: Informations de compte.
              properties:
                id:
                  type: integer
                  example: 12345
                pseudo:
                  type: string
                  example: Steve
                mail:
                  type: string
                  example: steve@example.com
                mail_validated:
                  type: integer
                  description: 1 si l'e-mail est vérifié.
                  enum:
                    - 0
                    - 1
                  example: 1
                money:
                  type: number
                  description: Solde de crédits.
                  example: 12.5
                lang:
                  type: string
                  enum:
                    - fr
                    - en
                  example: fr
                register_date:
                  type: string
                  description: Date d'inscription (`Y-m-d H:i:s`).
                  example: '2024-01-15 18:42:10'
            linked_account:
              type: object
              description: Comptes de jeu liés (clé présente seulement si le compte est lié).
              properties:
                minecraft:
                  type: object
                  properties:
                    uuid:
                      type: string
                      example: 853c80ef3c3749fdaa49938b674adae6
                    name:
                      type: string
                      example: Steve
                discord:
                  type: object
                  properties:
                    id:
                      type: string
                      example: '123456789012345678'
                    name:
                      type: string
                      example: steve#0001
    ApiError:
      type: object
      properties:
        api:
          type: object
          properties:
            description:
              type: string
              description: Description de l'endpoint appelé
            endpoint:
              type: string
              description: Path de l'endpoint appelé
            code:
              type: integer
              description: Code HTTP de la réponse
            error:
              type: string
              description: Code d'erreur API
              example: API_MISSING_REQUIRED_FIELDS
            data:
              type: object
              description: Données contextuelles optionnelles selon l'erreur (ex. `id_mybox` sur API_SERVER_EXPIRED, `reason` sur API_SERVER_SUSPENDED).
    UserServersData:
      type: object
      properties:
        servers_groups:
          type: object
          description: |
            MyBox accessibles par l'utilisateur, **indexées par ID de MyBox**.
            Chaque valeur :
          additionalProperties:
            type: object
            properties:
              id:
                type: integer
                example: 12345
              name:
                type: string
                example: Ma MyBox
              owner:
                type: integer
                description: 1 si propriétaire, 0 si sous-utilisateur.
                enum:
                  - 0
                  - 1
                example: 1
              offer:
                type: string
                description: Nom de l'offre.
                example: MyBox 8
              resources:
                type: object
                description: Ressources de l'offre (cpu en cœurs, ram et disk en Go).
                properties:
                  cpu:
                    type: integer
                    example: 4
                  ram:
                    type: integer
                    example: 8
                  disk:
                    type: integer
                    example: 50
              tend:
                type: string
                description: Date d'expiration (`Y-m-d H:i:s`).
                example: '2026-09-01 00:00:00'
              tend_days:
                type: integer
                description: Jours restants avant expiration (0 si expirée).
                example: 74
              is_free:
                type: integer
                enum:
                  - 0
                  - 1
                example: 0
              is_trial:
                type: integer
                enum:
                  - 0
                  - 1
                example: 0
              is_pro:
                type: integer
                description: 1 si MyBox Pro (dédiée).
                enum:
                  - 0
                  - 1
                example: 0
              is_expired:
                type: integer
                enum:
                  - 0
                  - 1
                example: 0
              is_suspended:
                type: integer
                enum:
                  - 0
                  - 1
                example: 0
        servers:
          type: array
          description: Serveurs de l'utilisateur (possédés + accessibles en sous-utilisateur).
          items:
            type: object
            properties:
              id:
                type: integer
                example: 67890
              name:
                type: string
                example: Survie 1.21
              id_mybox:
                type: integer
                description: MyBox parente.
                example: 12345
              id_egg:
                type: integer
                description: Type de jeu (egg).
                example: 1
              egg_name:
                type: string
                example: Minecraft Java
              egg_icon:
                type: string
                example: https://cdn.minestrator.com/eggs/minecraft.png
              egg_uuid:
                type: string
                example: a1b2c3d4-0000-0000-0000-000000000000
              hashsupport:
