          type: string
          description: UUID complet du serveur
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        id_daemon:
          type: integer
          description: ID du nœud physique hébergeant le serveur
        id_mybox:
          type: integer
          description: ID de la MyBox parente
          example: 12345
        offre:
          type: string
          description: Nom de l'offre
        is_free:
          type: integer
          enum:
            - 0
            - 1
          description: 1 si serveur gratuit
        hashsupport:
          type: string
          description: Identifiant court à communiquer au support
          example: AB3CD
        tstart:
          type: string
          format: date-time
          description: Début de la période en cours
        tend:
          type: string
          format: date-time
          description: Fin de la période en cours (expiration)
        dedicated_ip:
          type: integer
          enum:
            - 0
            - 1
          description: 1 si le serveur a une IP dédiée
        ip:
          type: string
          description: IP de connexion au serveur
          example: 94.231.203.18
        port:
          type: integer
          description: Port principal du serveur
          example: 25565
        dns:
          type:
            - string
            - 'null'
          description: Sous-domaine DNS personnalisé (null si non configuré)
          example: monserveur.myjeux.fr
        owner:
          type: integer
          enum:
            - 0
            - 1
          description: 1 si l'utilisateur authentifié est le propriétaire
        name:
          type: string
          description: Nom du serveur
          example: Mon serveur Minecraft
        id_groupe:
          type:
            - integer
            - 'null'
          description: Groupe d'organisation dans la MyBox
        ordre:
          type: integer
          description: Ordre d'affichage dans la MyBox
        permissions:
          type: array
          description: Permissions du sous-utilisateur sur ce serveur (vide si propriétaire)
          items:
            type: string
        hibernation:
          type: integer
          enum:
            - 0
            - 1
          description: 1 si le serveur est en hibernation
    ServerOffer:
      type: object
      description: Offre de la MyBox parente
      properties:
        name:
          type: string
          example: MyBox Diamond
        is_pro:
          type: integer
          enum:
            - 0
            - 1
          description: 1 si MyBox Pro (serveur dédié)
        is_trial:
          type: integer
          description: 1 si MyBox d'essai
          example: 0
        is_free:
          type: integer
          enum:
            - 0
            - 1
          description: 1 si MyBox gratuite
        cpu:
          type: integer
          description: CPU de l'offre (cœurs)
        ram:
          type: integer
          description: RAM de l'offre (Go)
        disk:
          type: integer
          description: Disque de l'offre (Go)
        auto_shutdown_seconds:
          type: integer
          description: 'Présent uniquement pour les serveurs gratuits : délai d''arrêt automatique en secondes. 14400 (4 h) par défaut, 86400 (24 h) si le compte possède aussi une MyBox payante active.'
          example: 14400
    ServerEgg:
      type: object
      description: Jeu/egg du serveur
      properties:
        id:
          type: integer
          example: 5
        type:
          type: integer
          description: ID du type d'egg
        name:
          type: string
          example: Minecraft Vanilla
        icon:
          type: string
          example: minecraft.png
        uuid:
          type: string
          description: UUID de l'egg
    ServerSettings:
      type: object
      description: Configuration du serveur
      properties:
        is_bedrock:
          type: integer
          enum:
            - 0
            - 1
          description: 1 si serveur Minecraft Bedrock Edition
        is_bungeecord:
          type: integer
          enum:
            - 0
            - 1
          description: 1 si serveur BungeeCord/proxy
        java_memory:
          type: integer
          description: Mémoire Java allouée (Mo)
        image:
          type: string
          description: Image Docker utilisée
          example: ghcr.io/pterodactyl/yolks:java_21
        id_java_version:
          type:
            - integer
            - 'null'
          description: ID de la version Java (absent si image non reconnue)
        startup:
          type: string
          description: Commande de démarrage
        startup_file:
          type:
            - string
            - 'null'
          description: Fichier JAR de démarrage (si applicable)
          example: server.jar
        poweraction_message:
          type: object
          description: Messages personnalisés affichés lors des actions d'alimentation avec countdown
          properties:
            restart:
              type: string
              example: Server restarting in $x seconds...
            stop:
              type: string
              example: Server stopping in $x seconds...
    ServerFullData:
      type: object
      properties:
        server:
          $ref: '#/components/schemas/ServerDatas'
        websocket:
          type: object
          description: Connexion websocket pour la console en temps réel (champs vides si serveur hiberné)
          properties:
            url:
              type: string
              example: wss://node1.mystrator.com:8080
            token:
              type: string
              example: eyJhbGciOiJI...
        mybox:
          type: object
          description: Infos résumées de la MyBox parente
          properties:
            name:
              type: string
              example: Ma MyBox
            hashsupport:
              type: string
              description: Identifiant court de la MyBox à communiquer au support
              example: WQ6KX
            refund_requested_at:
              type: string
              format: date-time
              description: Date de la dernière demande de remboursement (absent si aucune)
            reduction:
              type: integer
              description: Pourcentage de réduction promo récurrente (absent si aucune)
            to_review:
              type: integer
              enum:
                - 0
                - 1
              description: 1 si l'utilisateur peut laisser un avis sur cette MyBox
            resources:
              type: object
              properties:
                cpu:
                  type: integer
                  description: CPU alloué à ce serveur (cœurs)
                ram:
                  type: integer
                  description: RAM allouée à ce serveur (Go)
                disk:
                  type: integer
                  description: Disque total de la MyBox (Go) — offre + options souscrites
        offer:
          $ref: '#/components/schemas/ServerOffer'
        egg:
          $ref: '#/components/schemas/ServerEgg'
        settings:
          $ref: '#/components/schemas/ServerSettings'
        options:
          type: array
          description: Options souscrites pour ce serveur
          items:
            type: object
            properties:
              name:
                type: string
                example: RAM +2 Go
              price:
                type: string
                example: '3.99'
        history:
          type: array
          description: Dernières actions sur le serveur (max 20)
          items:
            type: object
            properties:
              date:
                type: string
                format: date-time
              ip:
                type:
                  - string
                  - 'null'
                description: IP à l'origine de l'action (null si action staff/infrastructure)
              is_staff:
                type: boolean
                description: true si l'action a été effectuée par le staff ou l'infrastructure
              action:
                type: string
                description: 'Nom de l''action (ex: power.start, maintenance.reinstall)'
                example: power.start
        ports:
          type: array
          description: Ports additionnels alloués — présent si propriétaire ou permission `ports_view`
          items:
            type: object
            properties:
              port:
                type: integer
                example: 25566
              ip:
                type: string
                example: 94.231.203.18
              description:
                type: string
                description: Note libre associée au port
                example: Dynmap
        sftp:
          type: object
          description: Identifiants SFTP — présent si propriétaire ou permission `sftp`
          properties:
            protocol:
              type: string
              example: sftp
            host:
              type: string
              example: node1.mystrator.com
            port:
              type: integer
              example: 2022
            user:
              type: string
              example: player123.abc12345
            password:
              type: string
        livemap:
          type: object
          description: Informations livemap — présent si propriétaire ou permission `livemap`
          properties:
            option:
              type: integer
              enum:
                - 0
                - 1
              description: 1 si l'option livemap est souscrite
            enabled:
              type: integer
              enum:
                - 0
                - 1
              description: 1 si la livemap est activée
            generated:
              type: integer
              enum:
                - 0
                - 1
              description: 1 si la carte est générée
            url:
              type: string
              example: https://node1.mystrator.com/s/abc12345-...
            start:
              type: string
              format: date-time
              description: Début de la dernière génération
            end:
              type: string
              format: date-time
              description: Fin de la dernière génération
            is_free:
              type: integer
              enum:
                - 0
                - 1
              description: 1 si l'option livemap serait gratuite pour cette MyBox (offres ≥ 19,99 €)
        onboarding:
          type: object
          description: État du guide d'onboarding du serveur
          properties:
            eligible:
              type: boolean
              description: true si le serveur est éligible au guide (serveurs récents uniquement)
            status:
              type: string
              description: État du guide pour ce serveur
              example: not_started
            user_disabled:
              type: boolean
              description: true si l'utilisateur a désactivé les guides sur son compte
    ServerLiveData:
      type: object
      properties:
        state:
          type: string
          enum:
            - online
            - starting
            - stopping
            - offline
          description: État courant du serveur
        status:
          type:
            - string
            - 'null'
          description: Statut interne (null si le serveur est hors-ligne sans état remonté)
        stats:
          type: object
          description: |
            Statistiques temps réel. Les blocs `cpu`/`memory`/`disk`/`network` sont
            présents dès que le serveur n'est pas hors-ligne. Les blocs `players`,
            `uptime`, `version`, `motd`, `hostname` ne sont présents que lorsque le
            serveur est `online`.
          properties:
            state:
              type: string
              enum:
                - online
                - starting
                - stopping
                - offline
            cpu:
              type: object
              description: Utilisation CPU (unités en centièmes de cœur — 100 = 1 cœur)
              properties:
                current:
                  type: number
                  description: Utilisation CPU instantanée
                dedicated:
                  type: integer
                  description: CPU dédié au serveur
                flexcore:
                  type: integer
                  description: CPU supplémentaire mutualisé (FlexCore) fourni par l'offre
                limit:
                  type: integer
                  description: CPU total disponible (dédié + FlexCore)
                percent:
                  type: integer
                  description: Utilisation CPU arrondie (100 = 1 cœur)
                is_bursting:
                  type: boolean
                  description: true si l'utilisation dépasse le CPU dédié (consommation du FlexCore)
            memory:
              type: object
              description: Mémoire (Mo)
              properties:
                current:
                  type: integer
                  description: Mémoire utilisée (Mo)
                limit:
                  type: integer
                  description: Limite mémoire (Mo)
                percent:
                  type: integer
                  description: Pourcentage d'utilisation
            disk:
              type: object
              description: Disque (Mo)
              properties:
                current:
                  type: integer
                  description: Espace disque utilisé (Mo)
                limit:
                  type: integer
                  description: Limite disque (Mo)
                percent:
                  type: integer
                  description: Pourcentage d'utilisation
            network:
              type: object
              description: Compteurs réseau cumulés (octets) remontés par le démon
              properties:
                rx_bytes:
                  type: integer
                  description: Octets reçus
                tx_bytes:
                  type: integer
                  description: Octets envoyés
            uptime:
              type: object
              description: Durée de fonctionnement (présent uniquement si `online`)
              properties:
                days:
                  type: integer
                hours:
                  type: integer
                minutes:
                  type: integer
                total_seconds:
                  type: integer
                  description: Uptime total en secondes
            players:
              type: object
              description: Joueurs connectés (présent uniquement si `online`, selon le jeu)
              properties:
                current:
                  type: integer
                  description: Nombre de joueurs connectés
                limit:
                  type: integer
                  description: Nombre maximum de slots
                list:
                  type: array
                  description: Liste des pseudos connectés (plafonnée à 300)
                  items:
                    type: string
            version:
              type: string
              description: Version du serveur (présent uniquement si `online`, selon le jeu)
            motd:
              type: string
              description: Message du jour, nettoyé des codes de couleur (présent uniquement si `online`, selon le jeu)
            hostname:
              type: string
              description: Hostname annoncé par le serveur (présent uniquement si `online`, selon le jeu)
  responses:
    Unauthorized:
      description: Token invalide ou manquant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            api:
              description: ''
              endpoint: ''
              code: 401
              error: API_INVALID_TOKEN
    Forbidden:
      description: Accès interdit (permissions insuffisantes, compte suspendu)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            api:
              description: ''
              endpoint: ''
              code: 403
              error: API_FORBIDDEN
    RateLimited:
      description: Trop de requêtes — rate limit atteint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            api:
              description: ''
              endpoint: ''
              code: 429
              error: API_RATE_LIMITED
    BadRequest:
      description: Requête invalide (champs manquants ou incorrects)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            api:
              description: ''
              endpoint: ''
              code: 400
              error: API_MISSING_REQUIRED_FIELDS
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            api:
              description: ''
              endpoint: ''
              code: 404
              error: API_EMPTY_RESOURCE
    ServerError:
      description: Erreur serveur interne
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            api:
              description: ''
              endpoint: ''
              code: 500
              error: API_GENERIC_ERROR
